en:{t:"Paris: History Guide",s:"Follow the stops, in historical order",tabs:["⚔️ Revolution","🏛️ Landmarks"],more:"Read the story",less:"Close",next:"Next stop →",f:"Note: in 1789 it was gunpowder (dynamite was only invented in 1867).",
T:[[
{k:"B",d:"14 July 1789",ti:"The Bastille",pl:"Place de la Bastille",x:"Parisians lack weapons and bread. In the morning they take muskets at Les Invalides, then march on the Bastille, a royal fortress storing gunpowder.",li:["Governor de Launay is killed after the fortress surrenders.","Only seven prisoners were inside: it was a symbol of absolute power."],fa:"The column is the July Column (1840), honouring 1830, not 1789. It stands on the Bastille's site."},
{k:"M",d:"1789 – 1792",ti:"The old Garde-Meuble (Hôtel de la Marine)",pl:"Place de la Concorde, north side",x:"In October 1789 the king is brought from Versailles to Paris. On 10 August 1792 the Tuileries fall and the monarchy is suspended. Next day Louis XV's statue on this square is toppled; it becomes Place de la Révolution.",li:["September 1792: the Crown Jewels are stolen from this building, then the Garde-Meuble.","22 September 1792: the Republic is proclaimed."],fa:"It was also the Navy Ministry during the Revolution."},
{k:"O",d:"21 January 1793",ti:"The Obelisk: where the king was executed",pl:"Centre of Place de la Concorde",x:"Sentenced to death by the Convention, Louis XVI is driven from the Temple prison. He is guillotined around 10:20 am, where his grandfather's statue once stood.",li:["16 Oct 1793: Marie-Antoinette is executed here.","During the Terror: Danton (April 1794), then Robespierre (28 July 1794). Over a thousand people died on this square."],fa:"The Luxor Obelisk (≈3,300 years old) was only erected in 1836."},
{k:"S",d:"1795",ti:"The square becomes “Concorde”",pl:"Statues of French cities",x:"After Robespierre's fall and the end of the Terror, the Directory renames the square “Concorde” in 1795: a name of reconciliation to turn the page on bloodshed.",li:["A statue of Liberty had replaced the king's.","City statues like this one were added in the 19th century."],fa:"Today it is one of Paris's finest squares."}],[
{k:"N",d:"1163 – 1345",ti:"Notre-Dame de Paris",pl:"Île de la Cité",x:"This Gothic cathedral was begun in 1163 under Bishop Maurice de Sully and largely finished by about 1345. During the Revolution it was looted and turned into a “Temple of Reason”.",li:["1804: Napoleon crowns himself emperor here.","Victor Hugo's novel (1831) sparked its 19th-century restoration."],fa:"After the fire of 15 April 2019, it reopened in December 2024."},
{k:"L",d:"c.1190 – 1989",ti:"The Louvre",pl:"Central Paris, right bank",x:"The Louvre began around 1190 as Philip II Augustus's fortress, then became a royal palace. On 10 August 1793, during the Revolution, it opened to the public as a museum.",li:["The glass pyramid by I. M. Pei opened in 1989.","The Mona Lisa is kept here."],fa:"It is among the most visited museums in the world."},
{k:"C",d:"1875 – 1914",ti:"Sacré-Cœur Basilica",pl:"Montmartre hill",x:"Building began in 1875, after the 1870–71 war and the Paris Commune. It was completed in 1914 and consecrated in 1919.",li:["The Commune uprising began on Montmartre on 18 March 1871.","Its stone stays white, and even whitens in the rain."],fa:"Montmartre is the highest hill in Paris."}]]},

{k:"B",d:"14 جولائی 1789",ti:"باستیل",pl:"پلاس دے لا باستیل",x:"پیرس کے عوام کے پاس ہتھیاروں اور روٹی کی کمی تھی۔ صبح انہوں نے انوالیدز سے بندوقیں لیں، پھر باستیل کے شاہی قلعے کی طرف بڑھے جہاں بارود ذخیرہ تھا۔",li:["قلعے کے ہتھیار ڈالنے کے بعد گورنر دے لونے مارا گیا۔","اندر صرف سات قیدی تھے؛ باستیل مطلق العنان بادشاہت کی علامت تھا۔"],fa:"یہ ستون جولائی کالم (1840) ہے جو 1830 کی یاد میں ہے، 1789 کی نہیں۔ یہ باستیل کی جگہ پر کھڑا ہے۔"},
{k:"M",d:"1789 – 1792",ti:"پرانا گارد-مبل (ہوتیل دے لا مارین)",pl:"پلاس دے لا کونکورد، شمالی جانب",x:"اکتوبر 1789 میں بادشاہ کو ورسائی سے پیرس لایا گیا۔ 10 اگست 1792 کو تویلری پر قبضہ ہوا اور بادشاہت معطل ہو گئی۔ اگلے دن اس چوک میں لوئی پانزدہم کا مجسمہ گرا دیا گیا اور اس کا نام ‘پلاس دے لا ریولیوشن’ ہو گیا۔",li:["ستمبر 1792: اس عمارت سے، جو تب گارد-مبل تھی، شاہی تاج کے جواہرات چوری ہوئے۔","22 ستمبر 1792: جمہوریہ کا اعلان ہوا۔"],fa:"انقلاب کے دوران یہ بحریہ کی وزارت بھی رہی۔"},
{k:"O",d:"21 جنوری 1793",ti:"مسلہ: جہاں بادشاہ کو سزا دی گئی",pl:"پلاس دے لا کونکورد کا مرکز",x:"کنونشن نے لوئی شانزدہم کو سزائے موت سنائی۔ انہیں ٹمپل کی جیل سے لایا گیا اور تقریباً صبح 10:20 پر گلوٹین کیا گیا، اسی جگہ جہاں ان کے دادا کا مجسمہ تھا۔",li:["16 اکتوبر 1793: ملکہ ماری انتوانیت کو یہیں سزا دی گئی۔","دورِ دہشت میں دانتون (اپریل 1794) اور روبسپیئر (28 جولائی 1794) بھی یہیں مارے گئے؛ ایک ہزار سے زیادہ لوگ اس چوک میں گلوٹین ہوئے۔"],fa:"لکسور کا مسلہ (تقریباً 3,300 سال پرانا) 1836 میں نصب ہوا۔"},
{k:"S",d:"1795",ti:"چوک ‘کونکورد’ بن گیا",pl:"فرانسیسی شہروں کے مجسمے",x:"روبسپیئر کے زوال اور دورِ دہشت کے خاتمے کے بعد 1795 میں ڈائریکٹری نے چوک کا نام ‘کونکورد’ (ہم آہنگی) رکھا۔",li:["انقلاب کے دوران بادشاہ کے مجسمے کی جگہ آزادی کا مجسمہ لگا تھا۔","اس جیسے شہری مجسمے انیسویں صدی میں شامل ہوئے۔"],fa:"آج یہ پیرس کے خوبصورت ترین چوکوں میں سے ہے۔"}],[
{k:"N",d:"1163 – 1345",ti:"نوتر ڈیم دے پاری",pl:"اِل دے لا سیتے",x:"یہ گوتھک کیتھیڈرل 1163 میں بشپ موریس دے سلی کے دور میں شروع ہوا اور تقریباً 1345 میں مکمل ہوا۔ انقلاب میں اسے لوٹا گیا اور ‘عقل کا مندر’ بنا دیا گیا۔",li:["1804: نپولین نے یہیں اپنی تاج پوشی کی۔","وکٹر ہیوگو کے ناول (1831) کے بعد اس کی بحالی ہوئی۔"],fa:"15 اپریل 2019 کی آگ کے بعد دسمبر 2024 میں یہ دوبارہ کھلا۔"},
{k:"L",d:"1190 – 1989",ti:"لوور",pl:"پیرس کا مرکز",x:"لوور 1190 کے قریب فلپ آگسٹس کے قلعے کے طور پر شروع ہوا، پھر شاہی محل بنا۔ 10 اگست 1793 کو، انقلاب کے دوران، یہ عوام کے لیے عجائب گھر کے طور پر کھلا۔",li:["آئی ایم پی کا شیشے کا اہرام 1989 میں کھلا۔","مونا لیزا یہاں رکھی ہے۔"],fa:"یہ دنیا کے سب سے زیادہ دیکھے جانے والے عجائب گھروں میں سے ہے۔"},
{k:"C",d:"1875 – 1914",ti:"ساکری کور",pl:"مونمارتر کی پہاڑی",x:"1870–71 کی جنگ اور پیرس کمیون کے بعد 1875 میں تعمیر شروع ہوئی؛ یہ 1914 میں مکمل اور 1919 میں مقدس کی گئی۔",li:["کمیون کی بغاوت 18 مارچ 1871 کو مونمارتر ہی سے شروع ہوئی۔","اس کا پتھر سفید رہتا ہے، بارش میں اور بھی سفید ہو جاتا ہے۔"],fa:"مونمارتر پیرس کی سب سے اونچی پہاڑی ہے۔"}]]}};
