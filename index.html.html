{k:"B",d:"14 juillet 1789",ti:"La Bastille",pl:"Place de la Bastille",x:"Le peuple de Paris manque d'armes et de pain. Le matin, il prend des fusils aux Invalides, puis marche sur la Bastille, forteresse royale où est stockée de la poudre.",
li:["Le gouverneur de Launay est tué après la reddition de la forteresse.","Il n'y avait que sept prisonniers : la Bastille était surtout un symbole du pouvoir absolu.","La forteresse est démolie en quelques mois."],
fa:"La colonne que vous voyez est la Colonne de Juillet (1840) : elle honore les journées de 1830, pas 1789. Mais elle se dresse sur l'emplacement de la Bastille."},
{k:"M",d:"1789 – 1792",ti:"L'ancien Garde-Meuble (Hôtel de la Marine)",pl:"Place de la Concorde, côté nord",x:"En octobre 1789 le roi est ramené de Versailles à Paris. Le 10 août 1792, les Tuileries sont prises et la monarchie est suspendue. Le lendemain, la statue de Louis XV qui ornait cette place est abattue : elle devient la place de la Révolution.",
li:["Septembre 1792 : les joyaux de la Couronne sont volés dans ce bâtiment, alors Garde-Meuble.","22 septembre 1792 : la République est proclamée.","Louis XVI est jugé par la Convention (décembre 1792 – janvier 1793)."],
fa:"Ce bâtiment fut aussi le ministère de la Marine pendant la Révolution."},
{k:"O",d:"21 janvier 1793",ti:"L'Obélisque : là où le roi fut exécuté",pl:"Centre de la place de la Concorde",x:"Condamné à mort par la Convention, Louis XVI est conduit en voiture depuis la prison du Temple. Il est guillotiné vers 10 h 20, sur l'emplacement de la statue de son aïeul.",
li:["16 octobre 1793 : Marie-Antoinette est exécutée ici.","Pendant la Terreur : Danton (avril 1794), puis Robespierre (28 juillet 1794).","Plus d'un millier de personnes sont guillotinées sur cette place."],
fa:"L'obélisque de Louxor (≈ 3 300 ans) n'a été installé qu'en 1836, à peu près là où se dressait l'échafaud."},
{k:"S",d:"1795",ti:"La place devient « Concorde »",pl:"Statues des villes de France",x:"Après la chute de Robespierre et la fin de la Terreur, le Directoire rebaptise la place « Concorde » en 1795 : un nom de réconciliation pour tourner la page du sang.",
li:["La statue de la Liberté avait remplacé celle du roi pendant la Révolution.","Les statues de villes (comme celle-ci) ont été ajoutées au XIXᵉ siècle.","1799 : Bonaparte prend le pouvoir ; la Révolution s'achève."],
fa:"Aujourd'hui la place est l'une des plus belles de Paris : la mémoire de l'histoire y est partout."}]},

{k:"B",d:"14 July 1789",ti:"The Bastille",pl:"Place de la Bastille",x:"Parisians lack weapons and bread. In the morning they take muskets at Les Invalides, then march on the Bastille, a royal fortress storing gunpowder.",
li:["Governor de Launay is killed after the fortress surrenders.","Only seven prisoners were inside: it was above all a symbol of absolute power.","The fortress is demolished within months."],
fa:"The column is the July Column (1840), honouring 1830, not 1789. It stands on the Bastille's site."},
{k:"M",d:"1789 – 1792",ti:"The old Garde-Meuble (Hôtel de la Marine)",pl:"Place de la Concorde, north side",x:"In October 1789 the king is brought from Versailles to Paris. On 10 August 1792 the Tuileries fall and the monarchy is suspended. Next day Louis XV's statue on this square is toppled; it becomes Place de la Révolution.",
li:["September 1792: the Crown Jewels are stolen from this building, then the Garde-Meuble.","22 September 1792: the Republic is proclaimed.","Louis XVI is tried by the Convention (Dec 1792 – Jan 1793)."],
